syntax = "proto3";

package loci.social;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "loci/achievement/achievement.proto";

option go_package = "github.com/FACorreiaa/loci-connect-proto/v5/gen/go/loci/social;social";

// SocialService is Loci's people layer: following, invite links, blocking,
// finding people by username, contacts or Facebook, and the following feed.
//
// Following is one-way. Two people who follow each other are friends, and
// "Friends" trip visibility is seen only by friends: both sides chose it.
// Accounts are public unless their owner makes them private; following a
// private account sends a follow request its owner approves.
//
// The friend RPCs (SendFriendRequest .. RemoveFriend) predate following and
// are kept for older clients. They are served from the follow graph:
// a friend request is a follow, accepting one follows back, and a follower
// the caller does not follow back is listed as an incoming request.
//
// GetInvite and GetPublicProfile accept anonymous callers (an invite link or
// a profile opened signed out); every other RPC needs a session.
service SocialService {
  // GetMyInvite returns the caller's invite link, creating it on first use.
  rpc GetMyInvite(GetMyInviteRequest) returns (GetMyInviteResponse);
  // RotateInvite replaces the caller's invite code; the old link stops working.
  rpc RotateInvite(RotateInviteRequest) returns (GetMyInviteResponse);
  // GetInvite describes an invite for its landing page. Expired or rotated
  // codes are NotFound.
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);
  // AcceptInvite makes the caller and the inviter friends at once (each
  // follows the other, whatever their privacy): opening a friend's link is
  // the consent on both sides.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);

  // Follow follows a user. Following a private account sends a follow request
  // instead (state REQUESTED); following again is a no-op.
  rpc Follow(FollowUserRequest) returns (FollowUserResponse);
  // Unfollow stops following a user, or withdraws a pending follow request.
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);
  // RemoveFollower makes a user stop following the caller.
  rpc RemoveFollower(RemoveFollowerRequest) returns (RemoveFollowerResponse);
  // ListFollowers and ListFollowing list a user's followers and the people
  // they follow, newest first. Empty user_id means the caller. A private
  // account's lists are PermissionDenied to anyone it has not approved.
  rpc ListFollowers(ListFollowersRequest) returns (ListFollowsResponse);
  rpc ListFollowing(ListFollowingRequest) returns (ListFollowsResponse);
  // ListFollowRequests lists pending follow requests to or from the caller.
  rpc ListFollowRequests(ListFollowRequestsRequest) returns (ListFollowRequestsResponse);
  // RespondFollowRequest approves or declines a request to follow the caller.
  rpc RespondFollowRequest(RespondFollowRequestRequest) returns (RespondFollowRequestResponse);
  // CancelFollowRequest withdraws a follow request the caller sent.
  rpc CancelFollowRequest(CancelFollowRequestRequest) returns (CancelFollowRequestResponse);
  // GetSocialSettings and SetAccountPrivacy read and set whether the caller's
  // account is private. Making it public approves every pending request.
  rpc GetSocialSettings(GetSocialSettingsRequest) returns (GetSocialSettingsResponse);
  rpc SetAccountPrivacy(SetAccountPrivacyRequest) returns (GetSocialSettingsResponse);

  // ListFeed is what the people the caller follows did lately: achievements
  // earned, new cities, trips finished and trips shared, newest first. Trips
  // appear only while the caller may still see them.
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);
  // Cheer and Uncheer add and take back the caller's cheer on a feed item.
  // Both are idempotent.
  rpc Cheer(CheerRequest) returns (CheerResponse);
  rpc Uncheer(UncheerRequest) returns (CheerResponse);

  // SendFriendRequest follows the user (kept for older clients; use Follow).
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse);
  // RespondFriendRequest accepts or declines an incoming request.
  rpc RespondFriendRequest(RespondFriendRequestRequest) returns (RespondFriendRequestResponse);
  // CancelFriendRequest withdraws a request the caller sent.
  rpc CancelFriendRequest(CancelFriendRequestRequest) returns (CancelFriendRequestResponse);
  rpc ListFriendRequests(ListFriendRequestsRequest) returns (ListFriendRequestsResponse);

  // ListFriends lists mutual follows.
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  // RemoveFriend ends following in both directions.
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);

  // BlockUser ends following in both directions and any pending request
  // between the two, and hides each side's content and profile from the
  // other.
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);

  // MatchContacts finds Loci users among the caller's contacts. Clients send
  // SHA-256 hashes of normalised identifiers, never the identifiers; only
  // verified phone numbers and emails match, and nothing is stored for
  // contacts who are not on Loci.
  rpc MatchContacts(MatchContactsRequest) returns (MatchContactsResponse);

  // MatchFacebookFriends finds Loci users among the caller's Facebook friends.
  // It reads the friend list Facebook granted at LinkFacebook, so it only
  // finds friends who also linked Facebook to Loci; it is FailedPrecondition
  // when the caller has not linked Facebook.
  rpc MatchFacebookFriends(MatchFacebookFriendsRequest) returns (MatchFacebookFriendsResponse);

  // SearchUsers finds users by username prefix.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  // GetPublicProfile is a user's profile as the caller may see it. A user who
  // blocked the caller is NotFound. A private account the caller may not see
  // still returns the card and counts, with can_view false.
  rpc GetPublicProfile(GetPublicProfileRequest) returns (GetPublicProfileResponse);
}

// PublicUser is what anyone may see about a user: never email or phone.
message PublicUser {
  string id = 1 [(buf.validate.field).string.max_len = 100];
  string username = 2 [(buf.validate.field).string.max_len = 100];
  string display_name = 3 [(buf.validate.field).string.max_len = 200];
  string avatar_url = 4 [(buf.validate.field).string.max_len = 2048];
  string home_city = 5 [(buf.validate.field).string.max_len = 200];
}

// Relationship is the caller's relation to another user in the older friend
// model, derived from the follow graph: FRIENDS when each follows the other,
// REQUESTED when only the caller follows (or asked to), INCOMING when only the
// other user does. New clients read FollowState and follows_you instead.
enum Relationship {
  RELATIONSHIP_UNSPECIFIED = 0;
  RELATIONSHIP_NONE = 1;
  // The caller sent a request that is still pending.
  RELATIONSHIP_REQUESTED = 2;
  // The other user sent the caller a request that is still pending.
  RELATIONSHIP_INCOMING = 3;
  RELATIONSHIP_FRIENDS = 4;
  // The caller blocked this user.
  RELATIONSHIP_BLOCKED = 5;
  RELATIONSHIP_SELF = 6;
}

// FollowState is whether the caller follows another user.
enum FollowState {
  FOLLOW_STATE_UNSPECIFIED = 0;
  FOLLOW_STATE_NONE = 1;
  // The caller asked to follow a private account; not yet approved.
  FOLLOW_STATE_REQUESTED = 2;
  FOLLOW_STATE_FOLLOWING = 3;
  // The caller blocked this user.
  FOLLOW_STATE_BLOCKED = 4;
  FOLLOW_STATE_SELF = 5;
}

message Friend {
  PublicUser user = 1;
  google.protobuf.Timestamp since = 2;
}

message FriendRequest {
  string id = 1 [(buf.validate.field).string.max_len = 100];
  PublicUser from = 2;
  PublicUser to = 3;
  google.protobuf.Timestamp created_at = 4;
}

message Invite {
  string code = 1 [(buf.validate.field).string.max_len = 50];
  string url = 2 [(buf.validate.field).string.max_len = 2048];
  // Unset: the code does not expire.
  google.protobuf.Timestamp expires_at = 3;
  PublicUser inviter = 4;
  // Message to send with the link, without the url. Share sheets take the url
  // as its own item; append it only where a channel takes one string (SMS,
  // a copied message).
  string share_text = 5 [(buf.validate.field).string.max_len = 500];
}

// ProfileStats are the counts a profile shows. Travel counts come from the
// user's travel history.
message ProfileStats {
  int32 cities = 1 [(buf.validate.field).int32.gte = 0];
  int32 countries = 2 [(buf.validate.field).int32.gte = 0];
  // Trips the caller may see on this profile.
  int32 visible_trips = 3 [(buf.validate.field).int32.gte = 0];
  // People who follow this user and whom this user follows back.
  int32 friends = 4 [(buf.validate.field).int32.gte = 0];
  int32 followers = 5 [(buf.validate.field).int32.gte = 0];
  int32 following = 6 [(buf.validate.field).int32.gte = 0];
  // Achievements earned (each reached track tier counts once).
  int32 achievements = 7 [(buf.validate.field).int32.gte = 0];
}

message GetMyInviteRequest {}

message GetMyInviteResponse {
  Invite invite = 1 [(buf.validate.field).required = true];
}

message RotateInviteRequest {}

message GetInviteRequest {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

message GetInviteResponse {
  Invite invite = 1 [(buf.validate.field).required = true];
  // The caller's relation to the inviter; UNSPECIFIED when signed out.
  Relationship relationship = 2;
  // UNSPECIFIED when signed out.
  FollowState follow_state = 3;
}

message AcceptInviteRequest {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

message AcceptInviteResponse {
  Friend friend = 1 [(buf.validate.field).required = true];
}

message SendFriendRequestRequest {
  oneof target {
    option (buf.validate.oneof).required = true;
    string user_id = 1 [(buf.validate.field).string.uuid = true];
    string username = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }];
  }
}

message SendFriendRequestResponse {
  // FRIENDS when the other user had already asked the caller: the two
  // requests meet and become a friendship.
  Relationship relationship = 1;
  FriendRequest request = 2;
}

message RespondFriendRequestRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  bool accept = 2;
}

message RespondFriendRequestResponse {
  // Set when accepted.
  Friend friend = 1;
}

message CancelFriendRequestRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
}

message CancelFriendRequestResponse {}

enum RequestDirection {
  REQUEST_DIRECTION_UNSPECIFIED = 0;
  REQUEST_DIRECTION_INCOMING = 1;
  REQUEST_DIRECTION_OUTGOING = 2;
}

message ListFriendRequestsRequest {
  RequestDirection direction = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message ListFriendRequestsResponse {
  repeated FriendRequest requests = 1;
}

message ListFriendsRequest {}

message ListFriendsResponse {
  repeated Friend friends = 1;
}

message RemoveFriendRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message RemoveFriendResponse {}

message BlockUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message BlockUserResponse {}

message UnblockUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message UnblockUserResponse {}

message MatchContactsRequest {
  // Lower-case hex SHA-256 of each normalised identifier: phone numbers in
  // E.164 ("+351912345678"), emails trimmed and lower-cased.
  repeated string hashes = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2000
    items: {
      string: {
        len: 64
        pattern: "^[0-9a-f]{64}$"
      }
    }
  }];
}

message ContactMatch {
  // The hash the client sent, so it can show which contact matched.
  string hash = 1 [(buf.validate.field).string.len = 64];
  PublicUser user = 2;
  Relationship relationship = 3;
  FollowState follow_state = 4;
  bool follows_you = 5;
}

message MatchContactsResponse {
  repeated ContactMatch matches = 1;
}

message MatchFacebookFriendsRequest {}

message MatchFacebookFriendsResponse {
  repeated UserResult matches = 1;
}

message SearchUsersRequest {
  string query = 1 [(buf.validate.field).string = {
    min_len: 2
    max_len: 100
  }];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 50
  }];
}

message UserResult {
  PublicUser user = 1;
  Relationship relationship = 2;
  FollowState follow_state = 3;
  bool follows_you = 4;
}

message SearchUsersResponse {
  repeated UserResult users = 1;
}

message GetPublicProfileRequest {
  oneof target {
    option (buf.validate.oneof).required = true;
    string user_id = 1 [(buf.validate.field).string.uuid = true];
    string username = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }];
  }
}

message GetPublicProfileResponse {
  PublicUser user = 1 [(buf.validate.field).required = true];
  ProfileStats stats = 2;
  // UNSPECIFIED when signed out.
  Relationship relationship = 3;
  google.protobuf.Timestamp member_since = 4;
  // UNSPECIFIED when signed out.
  FollowState follow_state = 5;
  // Whether this user follows the caller.
  bool follows_you = 6;
  bool is_private = 7;
  // False when the account is private and the caller is not an approved
  // follower: trips, achievements and follow lists are left out.
  bool can_view = 8;
  // Achievements to show off: the newest and rarest earned, at most twelve.
  repeated loci.achievement.AchievementSummary showcase = 9 [(buf.validate.field).repeated.max_items = 12];
}

message FollowUserRequest {
  oneof target {
    option (buf.validate.oneof).required = true;
    string user_id = 1 [(buf.validate.field).string.uuid = true];
    string username = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }];
  }
}

message FollowUserResponse {
  // FOLLOWING, or REQUESTED for a private account.
  FollowState follow_state = 1;
  bool follows_you = 2;
  PublicUser user = 3;
}

message UnfollowRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message UnfollowResponse {}

message RemoveFollowerRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message RemoveFollowerResponse {}

message ListFollowersRequest {
  // Empty means the caller.
  string user_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 3 [(buf.validate.field).string.max_len = 200];
}

message ListFollowingRequest {
  // Empty means the caller.
  string user_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 3 [(buf.validate.field).string.max_len = 200];
}

// FollowEntry is one person in a followers or following list.
message FollowEntry {
  PublicUser user = 1;
  // When the follow began.
  google.protobuf.Timestamp since = 2;
  // Whether the caller follows this person.
  FollowState follow_state = 3;
  // Whether this person follows the caller.
  bool follows_you = 4;
}

message ListFollowsResponse {
  repeated FollowEntry entries = 1;
  string next_page_token = 2;
  int32 total = 3 [(buf.validate.field).int32.gte = 0];
}

message FollowRequestEntry {
  string id = 1 [(buf.validate.field).string.max_len = 100];
  PublicUser from = 2;
  PublicUser to = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListFollowRequestsRequest {
  RequestDirection direction = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message ListFollowRequestsResponse {
  repeated FollowRequestEntry requests = 1;
}

message RespondFollowRequestRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  bool approve = 2;
}

message RespondFollowRequestResponse {}

message CancelFollowRequestRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
}

message CancelFollowRequestResponse {}

message SocialSettings {
  bool is_private = 1;
  // Pending requests to follow the caller.
  int32 pending_requests = 2 [(buf.validate.field).int32.gte = 0];
}

message GetSocialSettingsRequest {}

message SetAccountPrivacyRequest {
  bool is_private = 1;
}

message GetSocialSettingsResponse {
  SocialSettings settings = 1;
}

enum FeedItemKind {
  FEED_ITEM_KIND_UNSPECIFIED = 0;
  FEED_ITEM_KIND_ACHIEVEMENT_UNLOCKED = 1;
  // The first place visited in a city.
  FEED_ITEM_KIND_NEW_CITY = 2;
  FEED_ITEM_KIND_TRIP_FINISHED = 3;
  // A trip made visible to friends or to everyone.
  FEED_ITEM_KIND_TRIP_SHARED = 4;
}

message FeedCity {
  string city_id = 1 [(buf.validate.field).string.max_len = 100];
  string city_name = 2 [(buf.validate.field).string.max_len = 200];
  string country = 3 [(buf.validate.field).string.max_len = 200];
}

message FeedTrip {
  string trip_id = 1 [(buf.validate.field).string.max_len = 100];
  string title = 2 [(buf.validate.field).string.max_len = 300];
  string city_name = 3 [(buf.validate.field).string.max_len = 200];
  int32 days = 4 [(buf.validate.field).int32.gte = 0];
  string cover_image_url = 5 [(buf.validate.field).string.max_len = 2048];
}

message FeedItem {
  string id = 1 [(buf.validate.field).string.max_len = 100];
  FeedItemKind kind = 2;
  PublicUser actor = 3;
  google.protobuf.Timestamp created_at = 4;
  oneof detail {
    loci.achievement.AchievementSummary achievement = 5;
    FeedCity city = 6;
    FeedTrip trip = 7;
  }
  int32 cheer_count = 8 [(buf.validate.field).int32.gte = 0];
  bool cheered_by_me = 9;
  // Up to three of the latest people who cheered.
  repeated PublicUser recent_cheerers = 10 [(buf.validate.field).repeated.max_items = 3];
}

message ListFeedRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 50
  }];
  string page_token = 2 [(buf.validate.field).string.max_len = 200];
}

message ListFeedResponse {
  repeated FeedItem items = 1;
  string next_page_token = 2;
}

message CheerRequest {
  string item_id = 1 [(buf.validate.field).string.uuid = true];
}

message UncheerRequest {
  string item_id = 1 [(buf.validate.field).string.uuid = true];
}

message CheerResponse {
  int32 cheer_count = 1 [(buf.validate.field).int32.gte = 0];
  bool cheered_by_me = 2;
}
