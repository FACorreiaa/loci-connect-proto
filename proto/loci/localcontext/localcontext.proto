syntax = "proto3";

package loci.localcontext;

option go_package = "github.com/FACorreiaa/loci-connect-proto/v5/gen/go/loci/localcontext;localcontext";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// AlertKind classifies a trip-time heads-up.
//
// Values are only ever appended. Reordering or removing one silently changes
// the meaning of data already on the wire.
enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  ALERT_KIND_CLOSURE = 1;
  ALERT_KIND_HOLIDAY = 2;
  ALERT_KIND_STRIKE = 3;
  // A natural hazard near the destination — wildfire, cyclone, flood,
  // earthquake, volcanic activity.
  ALERT_KIND_HAZARD = 4;
  ALERT_KIND_AIR_QUALITY = 5;
  ALERT_KIND_TRANSIT = 6;
  ALERT_KIND_ADVISORY = 7;
}

// WeatherDay is a one-day forecast summary.
message WeatherDay {
  google.protobuf.Timestamp date = 1 [(buf.validate.field).required = true];
  double high_c = 2;
  double low_c = 3;
  string condition = 4 [(buf.validate.field).string = {max_len: 100}];
  double precip_prob = 5 [(buf.validate.field).double = {gte: 0, lte: 1}];
}

// LocalAlert warns about something affecting a trip day (closure/holiday/
// hazard/strike).
message LocalAlert {
  AlertKind kind = 1 [(buf.validate.field).enum = {defined_only: true}];
  string title = 2 [(buf.validate.field).string = {min_len: 1, max_len: 300}];
  string detail = 3 [(buf.validate.field).string = {max_len: 1000}];
  optional google.protobuf.Timestamp date = 4;

  // How much this should count against the trip, 0..1.
  //
  // The server grades alerts rather than treating them alike — a public holiday
  // and a red-level wildfire are not the same news — and the go-score's
  // disruption penalty scales with this. Clients should use it to rank and to
  // colour, never to decide whether to show an alert at all.
  double severity = 5 [(buf.validate.field).double = {gte: 0, lte: 1}];

  // Which provider reported it ("nager", "gdacs", "usgs"). Shown so a user can
  // see who says so, and so a noisy feed is identifiable from the response
  // rather than only from server logs.
  string source = 6 [(buf.validate.field).string = {max_len: 50}];

  // Where the alert is, when it has a place — a wildfire, a cyclone, an
  // earthquake. Absent for anything country-scoped: a public holiday has no
  // coordinates, and inventing some to make it mappable would be a lie.
  // Only alerts carrying both can be drawn as map pins.
  optional double latitude = 7 [(buf.validate.field).double = {gte: -90, lte: 90}];
  optional double longitude = 8 [(buf.validate.field).double = {gte: -180, lte: 180}];
}

// GetLocalContextRequest asks for weather + alerts near a point.
message GetLocalContextRequest {
  double latitude = 1 [(buf.validate.field).double = {gte: -90, lte: 90}];
  double longitude = 2 [(buf.validate.field).double = {gte: -180, lte: 180}];
  // Forecast horizon in days (server clamps to what the provider supports).
  int32 days = 3 [(buf.validate.field).int32 = {gte: 0, lte: 16}];
}

// LocalContext is the trip-time local information for a location.
message LocalContext {
  repeated WeatherDay weather = 1;
  repeated LocalAlert alerts = 2;
  // weather_is_estimated is true when a placeholder/stub provider was used
  // (no real weather key configured) — the client should label it as such.
  bool weather_is_estimated = 3;
}

// ScoreFactor is one dimension of the go/no-go judgement, with its reasoning.
// The score is always shown WITH these: a bare number is not an explanation,
// and a user who disagrees with it should be able to see why it landed there.
message ScoreFactor {
  string label = 1 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  // Signed points this dimension contributed (negative for disruptions).
  int32 contribution = 2;
  // Ceiling for this dimension, so a client can render "22 / 40" or a
  // proportional bar without hardcoding the weights.
  int32 max_contribution = 3 [(buf.validate.field).int32 = {gte: 0}];
  string detail = 4 [(buf.validate.field).string = {max_len: 500}];
}

// GoScore answers "should I go here, in this window?".
message GoScore {
  int32 score = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  // One of "go", "maybe", "skip".
  string verdict = 2 [(buf.validate.field).string = {min_len: 1, max_len: 20}];
  repeated ScoreFactor factors = 3;
  string summary = 4 [(buf.validate.field).string = {max_len: 300}];
  // True when any input was a stub rather than real provider data. Clients MUST
  // label the score as estimated when this is set.
  bool has_estimated_inputs = 5;
}

// GetGoScoreRequest asks whether a city is worth the trip in a given window.
message GetGoScoreRequest {
  // Destination, by name (fuzzy-matched) or by coordinates.
  optional string city_name = 1 [(buf.validate.field).string = {max_len: 200}];
  optional double latitude = 2 [(buf.validate.field).double = {gte: -90, lte: 90}];
  optional double longitude = 3 [(buf.validate.field).double = {gte: -180, lte: 180}];
  // Where the traveller starts from, used for travel time.
  optional double origin_lat = 4 [(buf.validate.field).double = {gte: -90, lte: 90}];
  optional double origin_lon = 5 [(buf.validate.field).double = {gte: -180, lte: 180}];
  // Trip window. Defaults to a 48-hour weekend when omitted.
  optional google.protobuf.Timestamp start = 6;
  optional google.protobuf.Timestamp end = 7;
}

// GetGoScoreResponse carries the verdict and the resolved destination.
message GetGoScoreResponse {
  GoScore score = 1;
  string city_name = 2 [(buf.validate.field).string = {max_len: 200}];
}

// FxRate is one currency pair at a point in time.
//
// Reference rates republished from the ECB. They are exact rather than
// modelled, but the ECB publishes only 30 currencies — anywhere else returns no
// rate at all, because a made-up number about someone's money is worse than
// none.
message FxRate {
  string base = 1 [(buf.validate.field).string.len = 3];
  string quote = 2 [(buf.validate.field).string.len = 3];
  double rate = 3 [(buf.validate.field).double = {gt: 0}];
  // The day the rate was published. Shown so a user can tell a Friday rate read
  // on a Sunday for what it is.
  google.protobuf.Timestamp as_of = 4;
}

// GetFxRatesRequest asks what the traveller's money is worth at a destination.
message GetFxRatesRequest {
  // ISO-4217. Defaults to the server's configured base when empty.
  optional string base = 1 [(buf.validate.field).string = {max_len: 3}];
  // Explicit quote currencies. When empty, country_code is used instead.
  repeated string quotes = 2 [(buf.validate.field).repeated = {max_items: 10}];
  // ISO-3166 alpha-2. A convenience so a caller holding a destination does not
  // have to know its currency.
  optional string country_code = 3 [(buf.validate.field).string = {max_len: 2}];

  // Coordinates, resolved to a country server-side.
  //
  // The most useful entry point in practice: a client holding a destination
  // usually has its coordinates, and often only a display country name like
  // "Portugal" rather than an ISO code. Resolving that name client-side would
  // mean duplicating a country table that already exists on the server, so the
  // server does it with the same geocoder it runs for alerts.
  //
  // Ignored when country_code or quotes are supplied.
  optional double latitude = 4 [(buf.validate.field).double = {gte: -90, lte: 90}];
  optional double longitude = 5 [(buf.validate.field).double = {gte: -180, lte: 180}];
}

message GetFxRatesResponse {
  repeated FxRate rates = 1;
  // Currencies that were asked for, or implied by country_code, that the ECB
  // does not publish. Returned rather than dropped so a client can say "no rate
  // available" instead of silently showing nothing.
  repeated string unsupported = 2;
}

// DriveCostEstimate prices the fuel for a driving leg.
message DriveCostEstimate {
  double distance_km = 1;
  double litres = 2;
  double cost = 3;
  string currency = 4 [(buf.validate.field).string = {max_len: 3}];
  // What the number rests on, in words. Always populated: a bare figure about
  // someone's money invites either misplaced trust or dismissal, and only the
  // assumptions let a user correct it against their own car.
  string assumptions = 5 [(buf.validate.field).string = {max_len: 500}];
}

message EstimateDriveCostRequest {
  double distance_km = 1 [(buf.validate.field).double = {gte: 0}];
  // ISO-4217 for the result. Defaults to the server's configured base.
  optional string currency = 2 [(buf.validate.field).string = {max_len: 3}];
}

message EstimateDriveCostResponse {
  DriveCostEstimate estimate = 1;
}

// LocalContextService surfaces trip-time context: weather, plus live alerts
// from public-holiday and natural-hazard providers.
service LocalContextService {
  rpc GetLocalContext(GetLocalContextRequest) returns (LocalContext);
  // GetGoScore answers "should I go this weekend?" for one destination.
  rpc GetGoScore(GetGoScoreRequest) returns (GetGoScoreResponse);
  // GetFxRates answers "what is my money worth there?".
  rpc GetFxRates(GetFxRatesRequest) returns (GetFxRatesResponse);
  // EstimateDriveCost prices the fuel for a driving leg.
  rpc EstimateDriveCost(EstimateDriveCostRequest) returns (EstimateDriveCostResponse);
}
