syntax = "proto3";

package loci.trip;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "loci/common/common.proto";
import "loci/poi/poi.proto";
import "loci/recommendation/recommendation.proto";

option go_package = "github.com/FACorreiaa/loci-connect-proto/v5/gen/go/loci/trip;trip";

// TripPace is how densely a day is packed.
enum TripPace {
  TRIP_PACE_UNSPECIFIED = 0;
  TRIP_PACE_RELAXED = 1;
  TRIP_PACE_MODERATE = 2;
  TRIP_PACE_PACKED = 3;
}

// TripConstraint holds the planning constraints for a trip. These override the
// user's search profile for this specific trip.
message TripConstraint {
  optional int32 budget_level = 1 [(buf.validate.field) = {
    int32: {
      gte: 1
      lte: 4
    }
  }];
  TripPace pace = 2 [(buf.validate.field).enum = {defined_only: true}];
  // mobility: e.g. "walking", "wheelchair", "transit", "car".
  optional string mobility = 3 [(buf.validate.field) = {
    string: {
      min_len: 1
      max_len: 100
    }
  }];
  repeated string interests = 4 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        min_len: 1
        max_len: 100
      }
    }
  }];
  // Daily active window, minutes from midnight (e.g. 540 = 09:00).
  optional int32 day_start_minute = 5 [(buf.validate.field) = {
    int32: {
      gte: 0
      lte: 1440
    }
  }];
  optional int32 day_end_minute = 6 [(buf.validate.field) = {
    int32: {
      gte: 0
      lte: 1440
    }
  }];
}

// TripStop is a single place on a day's timeline.
message TripStop {
  // Empty on create; the database assigns it. Clients may send their own id when
  // editing an existing stop.
  string id = 1 [(buf.validate.field).string = {max_len: 100}];
  string poi_id = 2 [(buf.validate.field).string = {max_len: 100}];
  // order_index positions the stop within its day (0-based).
  int32 order_index = 3 [(buf.validate.field).int32 = {gte: 0}];
  // Display name; user-editable (RenameStop) and defaults to the POI name.
  string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
  // start_minute is minutes from midnight for the stop's start.
  optional int32 start_minute = 5 [(buf.validate.field) = {
    int32: {
      gte: 0
      lte: 1440
    }
  }];
  // duration_minutes is how long to spend here.
  optional int32 duration_minutes = 6 [(buf.validate.field) = {int32: {gte: 0}}];
  string notes = 7 [(buf.validate.field).string = {max_len: 4000}];
  optional string booking_url = 8 [(buf.validate.field) = {
    string: {
      min_len: 1
      max_len: 2048
      uri: true
    }
  }];
  // Hydrated POI details for rendering (read side only; not persisted here).
  optional loci.poi.POIDetailedInfo poi = 9;
  optional loci.recommendation.RecommendationTrace recommendation_trace = 10;
}

// TripDay is one day of a trip.
message TripDay {
  // Empty on create; the database assigns it.
  string id = 1 [(buf.validate.field).string = {max_len: 100}];
  int32 day_number = 2 [(buf.validate.field).int32 = {gte: 1}];
  // Optional calendar date for the day (nil for a relative "Day N" plan).
  optional google.protobuf.Timestamp date = 3;
  repeated TripStop stops = 4;

  // Which city this day is spent in. Empty means the trip's primary city, which
  // is how every single-city trip written before multi-city support looks.
  string city_name = 5 [(buf.validate.field).string = {max_len: 200}];
  optional string city_id = 6 [(buf.validate.field) = {
    string: {
      min_len: 1
      max_len: 100
    }
  }];
  optional double city_lat = 7 [(buf.validate.field) = {
    double: {
      gte: -90
      lte: 90
    }
  }];
  optional double city_lon = 8 [(buf.validate.field) = {
    double: {
      gte: -180
      lte: 180
    }
  }];
  // True when the day includes a move between cities, so the UI can show that
  // sightseeing time is reduced.
  bool travel_day = 9;
}

// TripLeg is travel between two consecutive places in a multi-city trip.
message TripLeg {
  string id = 1 [(buf.validate.field).string = {max_len: 100}];
  string from_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string to_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  double from_lat = 4 [(buf.validate.field).double = {
    gte: -90
    lte: 90
  }];
  double from_lon = 5 [(buf.validate.field).double = {
    gte: -180
    lte: 180
  }];
  double to_lat = 6 [(buf.validate.field).double = {
    gte: -90
    lte: 90
  }];
  double to_lon = 7 [(buf.validate.field).double = {
    gte: -180
    lte: 180
  }];
  double distance_km = 8 [(buf.validate.field).double = {gte: 0}];
  int32 duration_mins = 9 [(buf.validate.field).int32 = {gte: 0}];
  // The day at whose end this leg happens. 0 is the outbound leg from home.
  int32 after_day = 10 [(buf.validate.field).int32 = {gte: 0}];
  // "drive" today; rail/air slot in without changing the shape.
  string mode = 11 [(buf.validate.field).string = {max_len: 40}];
  optional string booking_url = 12 [(buf.validate.field) = {
    string: {
      min_len: 1
      max_len: 2048
      uri: true
    }
  }];
}

// TripDraft is the full editable trip. `version` powers optimistic concurrency /
// merge-safe multi-device edits: SaveTrip rejects a write whose base version is
// stale.
message TripDraft {
  // Empty on create — the server assigns identity (repository.SaveTrip treats a
  // nil id as "new trip"). Requiring it made creating a trip impossible, which
  // is the one thing every trip has to do first.
  string id = 1 [(buf.validate.field).string = {max_len: 100}];
  string user_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  optional string city_id = 3 [(buf.validate.field) = {
    string: {
      min_len: 1
      max_len: 100
    }
  }];
  string city_name = 4 [(buf.validate.field).string = {max_len: 200}];
  string title = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
  TripConstraint constraints = 6;
  repeated TripDay days = 7;
  // Monotonic version; incremented server-side on every successful SaveTrip.
  int64 version = 8 [(buf.validate.field).int64 = {gte: 0}];
  // Travel between cities. Empty for a single-city trip. `city_name` above stays
  // the primary city (titles, exports) even when the trip spans several.
  repeated TripLeg legs = 12;
  // Session that generated the initial draft, if any.
  optional string source_session_id = 9 [(buf.validate.field) = {
    string: {
      min_len: 1
      max_len: 200
    }
  }];
  google.protobuf.Timestamp created_at = 10 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 11 [(buf.validate.field).required = true];
}

// TripSnapshot is an immutable point-in-time copy of a trip, written on each
// save so a device can reconcile against a known base version.
message TripSnapshot {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string trip_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  int64 version = 3 [(buf.validate.field).int64 = {gte: 0}];
  TripDraft trip = 4 [(buf.validate.field).required = true];
  google.protobuf.Timestamp created_at = 5 [(buf.validate.field).required = true];
}

// PackingCategory groups suggestions so a long list stays scannable.
enum PackingCategory {
  PACKING_CATEGORY_UNSPECIFIED = 0;
  PACKING_CATEGORY_ESSENTIALS = 1;
  PACKING_CATEGORY_CLOTHING = 2;
  PACKING_CATEGORY_WEATHER = 3;
  PACKING_CATEGORY_TECH = 4;
  PACKING_CATEGORY_HEALTH = 5;
  PACKING_CATEGORY_TRAVEL = 6;
  PACKING_CATEGORY_ACTIVITY = 7;
}

// PackingSuggestion is one suggested item, with the reason this trip earned it.
// The reason is not decoration: a suggestion the user cannot evaluate is noise,
// and they need enough to disagree with it.
message PackingSuggestion {
  string text = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
  PackingCategory category = 2 [(buf.validate.field).enum = {defined_only: true}];
  // Empty for universal essentials, which need no justification.
  string reason = 3 [(buf.validate.field).string = {max_len: 500}];
  // Things it would be genuinely bad to forget, so a client can lead with them.
  bool essential = 4;
}

// SuggestPackingRequest asks what to pack for a saved trip.
message SuggestPackingRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// SuggestPackingResponse carries the suggestions and how they were derived.
message SuggestPackingResponse {
  repeated PackingSuggestion suggestions = 1;
  // True when any city's forecast was a stub rather than real provider data, so
  // the client can label weather-driven items as estimated.
  bool weather_is_estimated = 2;
  // False when no forecast was available at all; weather-driven suggestions are
  // then absent rather than guessed.
  bool used_forecast = 3;
}

// ---- Requests / responses ----

message SaveTripRequest {
  // The full trip to upsert. For a new trip, id may be empty (server assigns).
  TripDraft trip = 1 [(buf.validate.field).required = true];
  // base_version is the version the client last read; the server rejects the
  // write with FailedPrecondition if the stored version has moved past it.
  int64 base_version = 2 [(buf.validate.field).int64 = {gte: 0}];
}

message GetTripRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

message ListTripsRequest {
  loci.common.PaginationRequest pagination = 1 [(buf.validate.field).required = true];
}

message ListTripsResponse {
  repeated TripDraft trips = 1;
  loci.common.PaginationMetadata pagination = 2;
}

message ShareTripRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  bool is_public = 2;
}

message ShareTripResponse {
  string share_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string share_url = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message ReorderStopsRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string day_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Stop ids in their new order.
  repeated string ordered_stop_ids = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 100
      }
    }
  }];
  int64 base_version = 4 [(buf.validate.field).int64 = {gte: 0}];
}

message RenameStopRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string stop_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
  int64 base_version = 4 [(buf.validate.field).int64 = {gte: 0}];
}

message EditStopDurationRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string stop_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  optional int32 start_minute = 3 [(buf.validate.field) = {
    int32: {
      gte: 0
      lte: 1440
    }
  }];
  int32 duration_minutes = 4 [(buf.validate.field).int32 = {gte: 0}];
  int64 base_version = 5 [(buf.validate.field).int64 = {gte: 0}];
}

message SetConstraintRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  TripConstraint constraints = 2 [(buf.validate.field).required = true];
  int64 base_version = 3 [(buf.validate.field).int64 = {gte: 0}];
}

message AddStopRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string day_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  TripStop stop = 3 [(buf.validate.field).required = true];
  int64 base_version = 4 [(buf.validate.field).int64 = {gte: 0}];
}

message RemoveStopRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string stop_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  int64 base_version = 3 [(buf.validate.field).int64 = {gte: 0}];
}

message ReplaceStopRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string stop_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  TripStop replacement = 3 [(buf.validate.field).required = true];
  int64 base_version = 4 [(buf.validate.field).int64 = {gte: 0}];
}

// ExportFormat selects the export artifact.
enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  EXPORT_FORMAT_ICS = 1;
  EXPORT_FORMAT_PDF = 2;
  EXPORT_FORMAT_MARKDOWN = 3; // Premium — full itinerary as Markdown
}

message ExportTripRequest {
  string trip_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  ExportFormat format = 2 [(buf.validate.field).enum = {defined_only: true}];
}

message ExportTripResponse {
  bytes data = 1 [(buf.validate.field).bytes = {max_len: 10485760}]; // 10MB cap
  string content_type = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string filename = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 300
  }];
}

// TripService persists and mutates editable day-by-day trips. All mutations that
// take base_version enforce optimistic concurrency and return the updated
// TripDraft (or affected sub-entity) with the bumped version.
service TripService {
  rpc SaveTrip(SaveTripRequest) returns (TripDraft);
  rpc GetTrip(GetTripRequest) returns (TripDraft);
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse);
  rpc ShareTrip(ShareTripRequest) returns (ShareTripResponse);
  rpc ReorderStops(ReorderStopsRequest) returns (TripDraft);
  rpc RenameStop(RenameStopRequest) returns (TripDraft);
  rpc EditStopDuration(EditStopDurationRequest) returns (TripDraft);
  rpc SetConstraint(SetConstraintRequest) returns (TripDraft);
  rpc AddStop(AddStopRequest) returns (TripDraft);
  rpc RemoveStop(RemoveStopRequest) returns (TripDraft);
  rpc ReplaceStop(ReplaceStopRequest) returns (TripDraft);
  rpc ExportTrip(ExportTripRequest) returns (ExportTripResponse);
  // SuggestPacking derives a packing list from the trip: its length, its cities'
  // forecasts, the driving between them, and the traveller's stated interests.
  rpc SuggestPacking(SuggestPackingRequest) returns (SuggestPackingResponse);
}
