syntax = "proto3";

package loci.trip;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "loci/social/social.proto";

option go_package = "github.com/FACorreiaa/loci-connect-proto/v5/gen/go/loci/trip;trip";

// Planning a trip together: the owner invites people by link, and they join
// the trip as members. Membership is the trip's own list; it does not follow
// from the follow graph, and leaving a trip does not unfollow anyone.

// TripRole is what a person may do on a trip.
enum TripRole {
  TRIP_ROLE_UNSPECIFIED = 0;
  // Made the trip. Never stored as a member; the trip's user_id.
  TRIP_ROLE_OWNER = 1;
  // Sees the trip and suggests changes for the owner to apply.
  TRIP_ROLE_CO_PLANNER = 2;
  // Sees the trip.
  TRIP_ROLE_VIEWER = 3;
}

message TripMember {
  loci.social.PublicUser user = 1;
  TripRole role = 2;
  // Unset for the owner.
  google.protobuf.Timestamp joined_at = 3;
}

// TripInvite is a link that adds whoever opens it to a trip. It expires, can
// be used a limited number of times, and the owner can revoke it.
message TripInvite {
  string code = 1 [(buf.validate.field).string.max_len = 50];
  string url = 2 [(buf.validate.field).string.max_len = 2048];
  TripRole role = 3;
  google.protobuf.Timestamp expires_at = 4;
  int32 max_uses = 5;
  int32 uses = 6;
}

// TripInvitePreview is what an invite link shows before joining. It is
// readable signed out, so it carries nothing the owner did not mean to send:
// no stops, no notes.
message TripInvitePreview {
  string trip_id = 1 [(buf.validate.field).string.max_len = 100];
  string title = 2 [(buf.validate.field).string.max_len = 300];
  string city_name = 3 [(buf.validate.field).string.max_len = 200];
  optional string start_date = 4 [(buf.validate.field).string.max_len = 10];
  optional string end_date = 5 [(buf.validate.field).string.max_len = 10];
  int32 day_count = 6;
  loci.social.PublicUser owner = 7;
  // The owner first, then members by joining order.
  repeated TripMember members = 8;
  // What joining makes the caller.
  TripRole role = 9;
  // False once the invite expired, was revoked or ran out of uses.
  bool joinable = 10;
  // The caller already belongs to the trip (owner or member). False signed out.
  bool already_member = 11;
}

message CreateTripInviteRequest {
  string trip_id = 1 [(buf.validate.field).string.uuid = true];
  // CO_PLANNER or VIEWER.
  TripRole role = 2 [(buf.validate.field).enum = {
    defined_only: true
    in: [
      2,
      3
    ]
  }];
}

message GetTripInviteRequest {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

message AcceptTripInviteRequest {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

message AcceptTripInviteResponse {
  string trip_id = 1 [(buf.validate.field).string.max_len = 100];
  TripRole role = 2;
}

message RevokeTripInviteRequest {
  string trip_id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

message RevokeTripInviteResponse {}

message ListTripMembersRequest {
  string trip_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListTripMembersResponse {
  // The owner first, then members by joining order.
  repeated TripMember members = 1;
}

message RemoveTripMemberRequest {
  string trip_id = 1 [(buf.validate.field).string.uuid = true];
  // The caller's own id leaves the trip.
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message RemoveTripMemberResponse {}

// TripComment is a note someone on the trip left, about the trip or one of
// its stops. Only the owner and members read and write them.
message TripComment {
  string id = 1 [(buf.validate.field).string.max_len = 100];
  string trip_id = 2 [(buf.validate.field).string.max_len = 100];
  // Empty for a comment about the whole trip. A stop that has since left the
  // trip keeps its id here; clients show such comments with the trip's.
  string stop_id = 3 [(buf.validate.field).string.max_len = 100];
  // Unset when the author's account is gone.
  loci.social.PublicUser author = 4;
  string body = 5 [(buf.validate.field).string.max_len = 2000];
  google.protobuf.Timestamp created_at = 6;
  // The caller wrote it.
  bool mine = 7;
  // The caller may delete it: its author, or the trip's owner.
  bool can_delete = 8;
}

message AddTripCommentRequest {
  string trip_id = 1 [(buf.validate.field).string.uuid = true];
  // Empty for a comment about the whole trip.
  string stop_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  string body = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];
}

message ListTripCommentsRequest {
  string trip_id = 1 [(buf.validate.field).string.uuid = true];
  // How many; 0 means the server default (100).
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Only comments older than this; unset for the newest.
  google.protobuf.Timestamp before = 3;
}

message ListTripCommentsResponse {
  // Oldest first: the newest `limit` comments before `before`, in reading
  // order. Deleted, removed, hidden and blocked-author comments are left out.
  repeated TripComment comments = 1;
  // There are older comments: ask again with `before` set to the first
  // comment's created_at.
  bool has_more = 2;
}

message DeleteTripCommentRequest {
  string comment_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteTripCommentResponse {}

message ReportTripCommentRequest {
  string comment_id = 1 [(buf.validate.field).string.uuid = true];
  // One of "spam", "inappropriate", "offensive", "other". The server rejects
  // anything else with InvalidArgument.
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
  string details = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 1000
  ];
}

message ReportTripCommentResponse {}

// What a moderator decides about a reported trip comment.
enum TripCommentModerationAction {
  TRIP_COMMENT_MODERATION_ACTION_UNSPECIFIED = 0;
  // The comment stays; its open reports are closed.
  TRIP_COMMENT_MODERATION_ACTION_KEEP = 1;
  // The comment leaves the trip for everyone.
  TRIP_COMMENT_MODERATION_ACTION_REMOVE = 2;
}

message ListReportedTripCommentsRequest {
  // Page size; 0 means the server default (20).
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // 1-based; 0 means the first page.
  int32 page = 2 [(buf.validate.field).int32 = {gte: 0}];
}

// How many open reports gave one reason.
message TripCommentReportReason {
  string reason = 1;
  int32 count = 2;
}

message ReportedTripComment {
  TripComment comment = 1;
  // Distinct people with an open report on the comment.
  int32 report_count = 2;
  repeated TripCommentReportReason reasons = 3;
  // The free-text details reporters gave, newest first; empty ones omitted.
  repeated string details = 4;
  google.protobuf.Timestamp last_reported_at = 5;
  // True when the comment is out of the trip because of its reports.
  bool hidden = 6;
}

message ListReportedTripCommentsResponse {
  repeated ReportedTripComment comments = 1;
  bool has_more = 2;
}

message ResolveTripCommentReportRequest {
  string comment_id = 1 [(buf.validate.field).string.uuid = true];
  TripCommentModerationAction action = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message ResolveTripCommentReportResponse {}
