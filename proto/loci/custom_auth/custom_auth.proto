syntax = "proto3";

package loci.custom_auth;

import "buf/validate/validate.proto";

option go_package = "github.com/FACorreiaa/loci-connect-proto/v5/gen/go/loci/custom_auth;customauth";

// OAuthProvider enum for supported OAuth providers
enum OAuthProvider {
  OAUTH_PROVIDER_UNSPECIFIED = 0;
  OAUTH_PROVIDER_GOOGLE = 1;
  OAUTH_PROVIDER_APPLE = 2;
  // Facebook Limited Login: the iOS SDK hands over an OIDC token signed by
  // Meta. It may carry no email, so it can link to a signed-in account but
  // cannot create one on its own.
  OAUTH_PROVIDER_FACEBOOK = 3;
}

// =====================
// OAuth Messages
// =====================

// GetOAuthURLRequest for initiating OAuth flow
message GetOAuthURLRequest {
  OAuthProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string redirect_uri = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

// GetOAuthURLResponse returns the OAuth authorization URL
message GetOAuthURLResponse {
  string auth_url = 1;
  string state = 2;
}

// OAuthCallbackRequest for handling OAuth callback
message OAuthCallbackRequest {
  OAuthProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string code = 2 [(buf.validate.field).string = {min_len: 1}];
  string state = 3 [(buf.validate.field).string = {min_len: 1}];
  // Invite code from the link that brought this person here. Used only when
  // the sign-in creates the account; a bad code is ignored, never an error.
  optional string invite_code = 4;
}

// OAuthCallbackResponse returns tokens after OAuth authentication
message OAuthCallbackResponse {
  string access_token = 1;
  string refresh_token = 2;
  string user_id = 3;
  string email = 4;
  string username = 5;
  bool is_new_user = 6;
}

// SignInWithIDTokenRequest is native sign-in (the iOS Apple and Google
// sheets). The device already holds an ID token signed by the provider, so
// there is no code to exchange: the server verifies the token against the
// provider's published keys and signs the person in by its subject.
message SignInWithIDTokenRequest {
  OAuthProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string id_token = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];
  // The raw nonce the app generated for this attempt. Google puts it in the
  // token as-is; Apple puts its SHA-256 hex digest.
  string nonce = 3 [(buf.validate.field).string = {
    min_len: 16
    max_len: 256
  }];
  // Apple hands over the person's name once, on first consent, and never puts
  // it in the token. Empty otherwise.
  string full_name = 4 [(buf.validate.field).string.max_len = 200];
  // Invite code from the link that brought this person here. Used only when
  // the sign-in creates the account; a bad code is ignored, never an error.
  optional string invite_code = 5;
}

// =====================
// Phone Auth Messages
// =====================

// SendPhoneVerificationRequest for initiating phone auth
message SendPhoneVerificationRequest {
  string phone_number = 1 [(buf.validate.field).string = {
    min_len: 10
    max_len: 20
    pattern: "^\\+[1-9]\\d{1,14}$"
  }];
}

// SendPhoneVerificationResponse confirms SMS was sent
message SendPhoneVerificationResponse {
  bool success = 1;
  string message = 2;
}

// VerifyPhoneRequest for verifying phone code
message VerifyPhoneRequest {
  string phone_number = 1 [(buf.validate.field).string = {
    min_len: 10
    max_len: 20
    pattern: "^\\+[1-9]\\d{1,14}$"
  }];
  string code = 2 [(buf.validate.field).string = {
    min_len: 4
    max_len: 8
  }];
}

// VerifyPhoneResponse returns tokens after phone verification
message VerifyPhoneResponse {
  string access_token = 1;
  string refresh_token = 2;
  string user_id = 3;
  bool is_new_user = 4;
}

// AttachVerifiedPhoneRequest checks an SMS code (sent with
// SendPhoneVerification) and attaches the number to the signed-in caller, so
// friends can find them from their contacts.
message AttachVerifiedPhoneRequest {
  string phone_number = 1 [(buf.validate.field).string = {
    min_len: 10
    max_len: 20
    pattern: "^\\+[1-9]\\d{1,14}$"
  }];
  string code = 2 [(buf.validate.field).string = {
    min_len: 4
    max_len: 8
  }];
}

message AttachVerifiedPhoneResponse {
  // The number as stored, E.164.
  string phone_number = 1;
}

// LinkFacebookRequest links a Facebook account to the signed-in caller so
// friends who also linked theirs can be found. The token is a Limited Login
// token, verified like SignInWithIDToken.
message LinkFacebookRequest {
  string id_token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16384
  }];
  string nonce = 2 [(buf.validate.field).string = {
    min_len: 16
    max_len: 256
  }];
}

message LinkFacebookResponse {
  bool linked = 1;
}

// =====================
// Service Definition
// =====================

// CustomAuthService handles alternative authentication methods (OAuth, Phone)
service CustomAuthService {
  // OAuth authentication
  rpc GetOAuthURL(GetOAuthURLRequest) returns (GetOAuthURLResponse);
  rpc OAuthCallback(OAuthCallbackRequest) returns (OAuthCallbackResponse);
  rpc SignInWithIDToken(SignInWithIDTokenRequest) returns (OAuthCallbackResponse);

  // Phone authentication
  rpc SendPhoneVerification(SendPhoneVerificationRequest) returns (SendPhoneVerificationResponse);
  rpc VerifyPhone(VerifyPhoneRequest) returns (VerifyPhoneResponse);
  // AttachVerifiedPhone needs a session. A number already verified on another
  // account is AlreadyExists.
  rpc AttachVerifiedPhone(AttachVerifiedPhoneRequest) returns (AttachVerifiedPhoneResponse);

  // LinkFacebook needs a session. A Facebook account linked to another Loci
  // account is AlreadyExists.
  rpc LinkFacebook(LinkFacebookRequest) returns (LinkFacebookResponse);
}
