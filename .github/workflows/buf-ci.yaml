name: Buf CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 1️⃣ Install buf
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          # Pinned deliberately. The action defaults to the newest buf, and
          # `buf format` output changes between releases: 1.71 collapses a
          # single-entry option onto one line and 1.72 expands it, so an
          # untouched repo goes red the day a release lands. Bump this on
          # purpose, reformat in the same commit.
          version: 1.72.0

      # 2️⃣ Run lint check
      - name: Lint proto files
        run: buf lint

      # 3️⃣ Verify breaking changes against last release (optional but recommended)
      - name: Check breaking changes
        run: buf breaking --against '.git#branch=main'

      # 5️⃣ Push to Buf Schema Registry (only on main)
      - name: Push to Buf Schema Registry
        if: github.ref == 'refs/heads/main'
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: buf push
