version: v2
managed:
  enabled: false
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.16.2
    out: gen/go
    opt: paths=source_relative
  # - remote: buf.build/protocolbuffers/kotlin:v33.0
  #   out: gen/kotlin
  # - remote: buf.build/connectrpc/kotlin:v0.7.4
  #   out: gen/kotlin-connect
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: gen
  - remote: buf.build/bufbuild/es:v2.10.1
    out: gen/ts
  - remote: buf.build/connectrpc/swift:v1.2.0
    out: gen/swift
    opt:
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
      - Visibility=Public
  - remote: buf.build/apple/swift:v1.28.2
    out: gen/swift
    opt:
      - Visibility=Public
  # OpenAPI v3.1 spec from the Connect protobufs (source for the Bruno collection).
  - remote: buf.build/community/sudorandom-connect-openapi:v0.25.1
    out: gen/openapi
    opt:
      - format=yaml
      - path=loci.openapi.yaml
